name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[deploy]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Publish built site to repo root
        run: |
          cp dist/index.html index.html
          rm -rf assets
          cp -r dist/assets assets
          cp -r dist/mana/. mana/
          cp -r dist/data/. data/
          cp dist/.nojekyll .nojekyll
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[deploy] Publish built site to GitHub Pages"
          file_pattern: index.html assets/** data/** mana/** .nojekyll
          skip_dirty_check: true
