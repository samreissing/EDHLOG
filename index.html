<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDHLOG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div class="brand">
          <h1>EDHLOG</h1>
          <p class="tagline">Commander game tracker & stats</p>
        </div>
        <nav class="nav" id="nav"></nav>
      </header>
      <main id="main"></main>
      <footer class="footer">
        <span>Data stored locally in your browser</span>
        <div class="footer-actions">
          <button type="button" class="btn btn-ghost" id="export-btn">Export JSON</button>
          <button type="button" class="btn btn-ghost" id="import-btn">Import JSON</button>
          <input type="file" id="import-file" accept=".json" hidden />
          <button type="button" class="btn btn-ghost btn-danger" id="reset-btn">Reset</button>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
